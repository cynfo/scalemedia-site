<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116">
  <!-- Outer hexagon – lys lilla border -->
  <polygon points="50,2 97,28 97,86 50,112 3,86 3,28" fill="#7C6FF7"/>
  <!-- Inner hexagon – mørk navy -->
  <polygon points="50,11 89,34 89,82 50,105 11,82 11,34" fill="#1C1840"/>

  <!-- Hode -->
  <circle cx="50" cy="38" r="9" fill="#9D8DF5"/>

  <!-- Kropp: skulder → armer ned-utover + midtlinje ned -->
  <!-- Venstre arm -->
  <line x1="50" y1="50" x2="27" y2="68" stroke="#9D8DF5" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Høyre arm -->
  <line x1="50" y1="50" x2="73" y2="68" stroke="#9D8DF5" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Kropp ned til hofte -->
  <line x1="50" y1="50" x2="50" y2="70" stroke="#9D8DF5" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Venstre bein -->
  <line x1="50" y1="70" x2="36" y2="91" stroke="#9D8DF5" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Høyre bein -->
  <line x1="50" y1="70" x2="64" y2="91" stroke="#9D8DF5" stroke-width="7.5" stroke-linecap="round"/>
</svg>
